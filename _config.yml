#-------------------------------
# General Site Settings
title: Gregg Bernstein
logo: # /images/gregg-logo.png # You can add own logo. For example '/images/logo.png'.
description: "The personal site of Gregg Bernstein: researcher & educator, author of Research Practice, and speaker."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://gregg.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter:
  username: greggcorp
  card: summary


#-------------------------------
# Author Settings
author:
  name: Gregg Bernstein
#  bio: I'm a user experience researcher and author of <i>Research Practice</i>.
  avatar: '/images/gb_head_home.jpg'

social:
- {icon: "fa-brands fa-medium", label: Medium, link: "https://medium.com/@greggcorp"}
- {icon: "fa-brands fa-linkedin", label: LinkedIn, link: "https://www.linkedin.com/in/greggbernstein"}
- {icon: "fa-solid fa-circle-question", label: Should I talk to a human?, link: "https://shoulditalktoahuman.com/"}
- {icon: "fa-solid fa-bookmark", label: My UXR bookmarks, link: "https://greggcorp.notion.site/Research-Practice-Bookmarks-6e6ffb6c8cc0484b8dc4b0485e584afd"}
- {icon: "fa-brands fa-bluesky", label: My Bluesky UXR starter pack, link: "https://bsky.app/starter-pack/gregg.io/3lawj4judhq2z"}
- {icon: "fa-solid fa-rss", label: Gregg.io RSS feed, link: "https://gregg.io/feed.xml"}
# - {icon: "fa-brands fa-mastodon", label: Mastodon, link: "https://mastodon.social/@greggcorp"}
# - {icon: "fa-twitter", label: Twitter, link: "https://twitter.com/greggcorp"}

#-------------------------------
# Hero Settings
hero:
  hero__title: 👋 Hello! I’m Gregg.
  hero__description: I'm a user experience researcher and designer. This site is where I work through ideas and share what I’m thinking. Questions? Get in touch!
  hero__image: '/images/gb_head_home.jpg'


#-------------------------------
# Newsletter (_includes/footer-widgets/widget-subscribe.html)
newsletter: true # To enable the mailchimp form, use the value 'true'. To disable the form, use the value 'false' or leave the field blank.
newsletter__title: Get updates in your inbox # Add your Title
newsletter__text: Subscribe to my newsletter to get my posts (and other randomness) delivered. # Add your description.
newsletter__button__text: Subscribe # Add your button text


#-------------------------------
# Contact Settings
contact:
  email: me@gregg.io # Add your email for contact form
  description: Have a question for me? Please get in touch! # Add a description of your form

# NOTE
# Joseph comes with a built-in contact form, that you can use with Formspree service to handle up to 50 submissions per month for free. You could also easily switch to another contact form service if you want.


#-------------------------------
# Comment Section (Disqus)
# disqus-identifier: anvodstudio-demo # add your shortname for Disqus Comment. For example anvodstudio-demo


#-------------------------------
# Analytics
# Using Cloudflare Web Analytics (configured in _includes/head.html)


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
encoding: utf-8
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
  - jekyll-feed
  - jekyll/tagging

paginate: 5
paginate_path: "/page/:num"

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  /:title

sass:
  sass_dir: _sass
  style: compressed

future: true