---
layout: default
---

<div class="container">
  <div class="row">
    <div class="col col-12">
      <div class="post__info">
        <h1 class="post__title tag__title">Posts about {{ page.tag }}: <strong>{{ site.tags[page.tag].size }}</strong></h1>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="row">
    <div class="col col-12">
      <div class="contaniner__inner animate">
        <div class="row">
          {% for post in page.posts %}
            {% include article-content.html %}
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
