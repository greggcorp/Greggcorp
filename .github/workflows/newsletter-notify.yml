name: Newsletter Draft Notification

on:
  push:
    branches: [master]
    paths:
      - '_posts/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open a notification issue for each new post
        uses: actions/github-script@v8
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const before = context.payload.before;
            const after = context.payload.after;

            let diffOutput = '';
            try {
              diffOutput = execSync(
                `git diff --diff-filter=A --name-only ${before} ${after} -- '_posts/*.md'`,
                { encoding: 'utf8' }
              );
            } catch (err) {
              core.warning(`git diff failed, skipping: ${err.message}`);
              return;
            }

            const newPosts = diffOutput.split('\n').filter(Boolean);

            for (const postPath of newPosts) {
              const raw = fs.readFileSync(postPath, 'utf8');
              const fmMatch = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!fmMatch) continue;
              const frontMatter = fmMatch[1];

              if (/^newsletter:\s*false\s*$/m.test(frontMatter)) {
                core.info(`Skipping ${postPath} (newsletter: false)`);
                continue;
              }

              const titleMatch = frontMatter.match(/^title:\s*"?(.*?)"?\s*$/m);
              const title = titleMatch ? titleMatch[1] : path.basename(postPath, '.md');

              const filename = path.basename(postPath, '.md');
              const slug = filename.replace(/^\d{4}-\d{2}-\d{2}-/, '');
              const emailUrl = `https://gregg.io/emails/${slug}.html`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Newsletter draft ready: ${title}`,
                body: [
                  `A new post was published: **${title}**`,
                  '',
                  `Email-ready HTML: ${emailUrl}`,
                  '',
                  '(Netlify takes a minute or two to deploy after a push — if the link 404s, give it a moment.)',
                  '',
                  'Copy the page source into EmailOctopus’s "Code your own" campaign editor, review, and send.',
                  '',
                  'Close this issue once the campaign is sent.'
                ].join('\n')
              });

              core.info(`Opened issue for ${postPath}`);
            }
